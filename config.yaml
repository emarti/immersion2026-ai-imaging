# OASIS-1 Alzheimer's CNN — pipeline configuration
# Single source of truth for steps 1-3. Every script reads this file.

# ---------------------------------------------------------------------------
# Data locations
# ---------------------------------------------------------------------------
# The RAW dataset root (machine-specific) is NOT set here -- it comes from the
# DATA_RAW_PATH environment variable, loaded from a gitignored .env file. Copy
# .env.example to .env and set it. See readme.md ("Configure data paths").
#
# All generated artifacts (metadata.csv, splits.yaml, manifest.yaml, and the
# train/validate/test PNG folders) are written under this repo-relative root,
# which is gitignored.
outputs_path: ./outputs

# The official OASIS-1 cross-sectional spreadsheet, used by step1 as a sanity check: it
# cross-checks the metadata.csv it derives from the per-session .txt files against this
# reference and reports any discrepancies. Non-fatal -- if the file is missing, the check
# is simply skipped, and the rest of the pipeline runs normally.
#
# CAREFUL: this path is relative to your RAW DATA root, *not* to this repo. It expands to
#     $DATA_RAW_PATH/docs/oasis_cross-sectional.xlsx
# The spreadsheet is OASIS material we do not redistribute, so it is not in the repo at
# all -- download-extract-data.sh fetches it from the OASIS site into a docs/ folder
# beside the discs. (An absolute path here is also accepted, and overrides all of this.)
reference_xlsx: docs/oasis_cross-sectional.xlsx

# One folder per DVD is expected under the raw root; each must be un-tarred
# manually before it is picked up here.
discs: [disc1, disc2, disc3, disc4, disc5, disc6, disc7, disc8, disc9, disc10, disc11, disc12]

# Glob (relative to a session directory) for the atlas-registered,
# gain-field-corrected, brain-masked volume we slice. The infix n3/n4 encodes
# the number of averaged scans, so we wildcard it.
image_glob: "PROCESSED/MPRAGE/T88_111/*_t88_masked_gfc.img"

# ---------------------------------------------------------------------------
# Class label display names
# ---------------------------------------------------------------------------
# The binary target is derived from CDR (Clinical Dementia Rating):
#   CDR 0            -> label 0  (cdr_negative)
#   CDR 0.5 / 1 / 2  -> label 1  (cdr_positive)   [any impairment, severities pooled]
# These strings are the human-readable class names used in plots and printouts.
# Cramped plots use the compact forms CDR- / CDR+.
labels:
  cdr_negative: "CDR Negative"   # label 0: CDR = 0
  cdr_positive: "CDR Positive"   # label 1: CDR = 0.5 / 1 / 2

# ---------------------------------------------------------------------------
# Cohort selection (step2)
# ---------------------------------------------------------------------------
# Two SEPARATE age bands, not one. Why: a single age_min/age_max forces one dial to do
# two conflicting jobs -- how MUCH data we get, and how age-confounded the honest numbers
# are. Splitting it in two lets TRAIN be big and age-diverse (more signal to learn from,
# confound and all) while VALIDATE/TEST stay narrow and age-matched (so the reported
# balanced accuracy isn't secretly measuring "can you guess age"). See introduction.md
# section 10 and internal/lab-notes.md for the age-confound background.
cohort:
  age_train:             # broad band, TRAIN only -- inclusive
    min: 50
    max: 90
  age_eval:               # narrow band shared by VALIDATE and TEST -- inclusive.
    min: 70               # This is the band internal/lab-notes.md Run 11 already found
    max: 79                # removes the age confound (age difference between groups ~1 yr).
  seed: 42               # reproducible sampling + splitting
  # Optional ADDITIONAL absolute cap, on top of the split fractions below (see `splits:`) --
  # for fast test runs. Applied independently to each of the three draws (validate, then
  # test, then train): halved for validate/test (this many per label), flat for train.
  # null = no extra cap.
  max_subjects: null

# ---------------------------------------------------------------------------
# Transverse (axial / horizontal) slice geometry (step3)
# ---------------------------------------------------------------------------
# The masked_gfc volume is 176 (L-R) x 208 (A-P) x 176 (I-S) at 1 mm isotropic.
# Transverse planes are taken along the I-S axis (axis index 2, length 176) --
# horizontal cuts, as if a frisbee sliced through the skull.
# Because voxels are 1 mm, an offset in mm equals an offset in voxels.
slices:
  slice_axis: 2                                # I-S axis (length 176)
  middle_index: 88                             # geometric centre = 176 // 2
  # Hippocampus band: axial I-S levels that contain the hippocampus. Standard
  # reference is Talairach z ~= -15 to -25 mm; in this atlas (origin at the index-88
  # geometric centre, ~10 mm above the AC) that maps to offsets -32..-20 (indices
  # 56-68), verified anatomically on the rendered slices.
  offsets_mm: [-27, -26, -25, -24, -23, -22]   # planes used for TRAINING (one patch per plane)
  eval_offset_mm: -24                # the single plane used for VALIDATION and TEST
  # step3 also draws a few "context" images: the full axial slice with a rectangle around
  # each hippocampus crop window, so you can SEE the ROI size in situ (train shows every
  # random-shift box per plane; val/test show the single box). This many subjects per split
  # are sampled (reproducibly). 0 disables. -> outputs/slice_context/<split>/
  context_samples: 3

# ---------------------------------------------------------------------------
# Hippocampus ROI crop (step3)
# ---------------------------------------------------------------------------
# Following the DL4MI tutorial, step3 cuts an in-plane patch around each
# hippocampus from every selected axial slice and saves LEFT and RIGHT as
# separate samples (doubles the training data). Ranges are voxel indices into the
# axial slice: `ap` = rows (anterior-posterior), `lr_left` = cols (left-right) for
# the LEFT hippocampus (higher col = patient's left). The RIGHT box is the LEFT box
# mirrored about the L-R centre. The patch is intentionally LARGER than the
# hippocampus so step4 can random-crop within it later.
hippocampus:
  ap: [80, 148]            # A-P rows  -> 68 px tall
  lr_left: [90, 148]       # L-R cols for the LEFT hippocampus  -> 58 px wide
  # ap: [76, 152]            # A-P rows  -> 76 px tall
  # lr_left: [90, 150]       # L-R cols for the LEFT hippocampus  -> 60 px wide
  # Training-only augmentation -- val/test always get the plain, unshifted,
  # unrotated box, for a clean deterministic evaluation. Random shifts
  # (tutorial's CropLeftHC(random_shift)) duplicate each TRAIN patch n_shifts
  # times at random (dx,dy) offsets within +/-random_shift voxels. Independently,
  # apply_random_reflections_rotations ALSO flips each shifted patch left-right
  # and top-to-bottom (each a fixed 25% chance, hardcoded in
  # step3-generate-slices.py) and rotates it by a random multiple of 90 degrees,
  # losslessly (crop-rotate-crop, never resized/interpolated). Orientation isn't
  # diagnostic on a small, centred ROI patch like this one -- atrophy looks the
  # same rotated or mirrored -- so these are the same idea, just synthetic, as the
  # free left/right reflection pair we already get from cropping both hippocampi
  # (introduction.md §10). See internal/lab-notes.md for what running with these
  # on actually showed.
  apply_random_shifts: true
  random_shift: 3
  n_shifts: 16
  apply_random_reflections_rotations: true

# ---------------------------------------------------------------------------
# Validate / test split (step2) -- train has no fraction, see below
# ---------------------------------------------------------------------------
# VALIDATE is drawn first, then TEST, then TRAIN gets everything left over. Each fraction
# below is a CEILING measured against the size of the BROAD age_train-eligible pool (not
# the narrow age_eval pool it's actually drawn from) -- but the subjects themselves only
# ever come from age_eval, balanced (equal cdr_negative/cdr_positive, sex free), hardcoded.
# Since age_eval-eligible is much smaller than age_train-eligible, the fraction you write
# here (e.g. 0.15) ends up being a MUCH bigger share of age_eval's own pool once drawn --
# step2 prints both percentages so you can see the real numbers. It's a ceiling, not a
# guarantee: if fewer eligible/balanced subjects exist than the target implies, you get
# fewer -- never padded or duplicated.
#
# TRAIN takes every age_train-eligible subject NOT claimed by validate/test -- no fraction,
# no cap here (see cohort.max_subjects for an optional absolute cap on all three, for fast
# test runs). Its resulting size is therefore whatever's left, not a fixed number -- it can
# land above or below any particular target you might have in mind.
splits:
  validate: 0.2
  test:     0.1

# ---------------------------------------------------------------------------
# Training (step4) + reporting (step5)
# ---------------------------------------------------------------------------
epochs: 30              # training passes in step4 (a CLI --epochs overrides)
avg_last_epochs: 10      # step5 averages validation metrics over the last N epochs

training:
  # Weight BCEWithLogitsLoss's two classes inversely to their counts in the TRAIN split
  # (pos_weight = n_cdr_negative_patches / n_cdr_positive_patches), so each CLASS
  # contributes equally to the gradient no matter how many patches it has -- the
  # training-time analogue of balanced accuracy (see introduction.md section 14, "Train
  # for balanced accuracy, not plain accuracy"). While cohort.balance used to keep train
  # itself close to 50/50, this was near a no-op (pos_weight ~= 1); now that train draws
  # unbalanced from the broad age_train band above, this is where it starts to matter.
  # Set to false to turn it off and compare directly against the same run with it on.
  balanced_loss: true

# ---------------------------------------------------------------------------
# Grad-CAM interpretability (step6)
# ---------------------------------------------------------------------------
# step6 overlays a heatmap of WHERE a trained model looks to push a patch toward
# CDR-positive (label 1). `model` names the checkpoint written by step4.
gradcam:
  model: model_4.pt       # which checkpoint to explain (defaults to step4's output)
  split: validate         # patches to sample from: train | validate | test
  n_samples: 12           # how many patches to visualize
  seed: 0                 # sampling seed (reproducible)
  overlay_alpha: 0.45     # heatmap opacity over the grayscale patch (0-1)

# ---------------------------------------------------------------------------
# Output artifact locations
# ---------------------------------------------------------------------------
# Not configured here: every artifact is derived from outputs_path by
# common.py (metadata.csv, splits.yaml, manifest.yaml, and <split>/ PNG folders).
